<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Studychat Logo Test</title>
<style>
body {
  background: #05060D;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  font-family: 'Inter', system-ui, sans-serif;
  color: #fff;
}
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}
/* 3D Y-axis rotation */
.studychat-logo-wrap {
  width: 90px;
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 700px;
}
.studychat-logo {
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.6s ease, filter 0.6s ease;
}
/* Idle: stays still with subtle purple glow */
.studychat-logo.idle {
  filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.4)) drop-shadow(0 0 18px rgba(99, 102, 241, 0.25));
}
/* Thinking: rotates continuously around its vertical axis, with a soft blue-purple glow */
.studychat-logo.thinking {
  animation: rotateYAxis 1.8s infinite linear;
}
@keyframes rotateYAxis {
  0% {
    transform: rotateY(0deg);
    filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.65)) drop-shadow(0 0 25px rgba(99, 102, 241, 0.45));
  }
  50% {
    filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.9)) drop-shadow(0 0 35px rgba(99, 102, 241, 0.65));
  }
  100% {
    transform: rotateY(360deg);
    filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.65)) drop-shadow(0 0 25px rgba(99, 102, 241, 0.45));
  }
}
/* Responding: rotation slows and stops */
.studychat-logo.responding {
  animation: rotateSlowDown 1s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
  filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.5));
}
@keyframes rotateSlowDown {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}
/* Error: subtle visual indicator appears */
.studychat-logo.error {
  filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.75)) drop-shadow(0 0 25px rgba(168, 85, 247, 0.4));
}
.brand-name {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.brand-study { color: #ffffff; }
.brand-chat { color: #a855f7; }

/* Thinking badge */
.thinking-badge {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  background: rgba(19, 23, 40, 0.85);
  border: 1px solid rgba(139, 92, 246, 0.25);
  padding: 10px 18px;
  border-radius: 24px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 25px rgba(139, 92, 246, 0.15);
  backdrop-filter: blur(10px);
}
.badge-logo {
  width: 28px;
  height: 28px;
  perspective: 500px;
}
.badge-text {
  font-size: 14px;
  font-weight: 600;
  color: #e2e8f0;
  letter-spacing: 0.2px;
}
.badge-dots {
  display: inline-flex;
  gap: 4px;
}
.badge-dots span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #a855f7;
  animation: dotWave 1.4s infinite ease-in-out both;
}
.badge-dots span:nth-child(1) { animation-delay: -0.32s; }
.badge-dots span:nth-child(2) { animation-delay: -0.16s; }
.badge-dots span:nth-child(3) { animation-delay: 0s; }
@keyframes dotWave {
  0%, 80%, 100% { transform: scale(0.7); opacity: 0.3; }
  40% { transform: scale(1.2); opacity: 1; background: #c084fc; box-shadow: 0 0 6px #a855f7; }
}

@media (prefers-reduced-motion: reduce) {
  .studychat-logo.thinking {
    animation: none;
    opacity: 0.85;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="studychat-logo-wrap">
    <svg class="studychat-logo thinking" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients matching the user's 3D purple ribbon image -->
        <linearGradient id="sc-cap-grad" x1="20" y1="10" x2="80" y2="40" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#a855f7" />
          <stop offset="50%" stop-color="#8b5cf6" />
          <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <linearGradient id="sc-cap-under" x1="25" y1="30" x2="75" y2="45" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#7c3aed" />
          <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>
        <linearGradient id="sc-ribbon-upper" x1="30" y1="25" x2="85" y2="60" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#c084fc" />
          <stop offset="40%" stop-color="#a855f7" />
          <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <linearGradient id="sc-ribbon-mid" x1="65" y1="50" x2="35" y2="80" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#9333ea" />
          <stop offset="50%" stop-color="#7c3aed" />
          <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>
        <linearGradient id="sc-ribbon-lower" x1="25" y1="65" x2="70" y2="95" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#8b5cf6" />
          <stop offset="50%" stop-color="#6366f1" />
          <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
      </defs>

      <!-- 1. Lower loop of S -->
      <path d="M 62 76 C 55 86 42 94 30 89 C 24 86 23 78 28 73 C 34 68 47 67 58 64 C 65 62 70 59 70 53 C 70 47 64 43 57 43 C 48 43 43 47 41 53 C 37 53 32 50 34 43 C 37 34 47 28 58 28 C 72 28 81 36 81 49 C 81 59 74 65 63 68 C 50 71 39 73 36 78 C 34 82 39 84 45 83 C 54 82 62 76 65 71 Z" fill="url(#sc-ribbon-mid)" opacity="0.3" />

      <!-- 2. Main 3D ribbon S -->
      <!-- Lower sweep -->
      <path d="M 64 73 C 58 82 46 88 34 85 C 24 82 24 72 32 66 C 41 60 55 60 66 56 C 73 53 78 47 77 39 C 76 32 68 28 58 28 C 46 28 38 34 35 42 L 24 37 C 29 24 42 17 58 17 C 76 17 88 26 89 40 C 90 51 83 59 71 64 C 58 69 44 69 39 74 C 36 77 38 80 43 80 C 51 80 59 75 64 69 Z" fill="url(#sc-ribbon-upper)" />

      <!-- Middle & lower 3D ribbon fold -->
      <path d="M 33 66 C 43 61 58 61 68 56 C 75 52 78 47 77 40 L 88 41 C 88 51 82 58 71 63 C 58 68 44 68 39 74 C 36 77 38 80 43 80 C 52 80 60 74 65 69 L 71 75 C 64 83 53 89 41 89 C 27 89 23 77 33 66 Z" fill="url(#sc-ribbon-lower)" />

      <!-- Upper 3D fold highlighting -->
      <path d="M 58 17 C 76 17 88 26 89 40 C 90 44 89 47 87 50 C 85 43 80 37 72 33 C 65 30 58 29 52 29 C 43 29 36 33 33 39 L 24 37 C 29 24 42 17 58 17 Z" fill="url(#sc-ribbon-upper)" />

      <!-- 3. Graduation Mortarboard Cap (tilted top) -->
      <!-- Cap base / skullcap -->
      <path d="M 38 23 C 38 23 45 28 57 27 C 69 26 73 21 73 21 C 73 21 70 29 57 30 C 44 31 38 23 38 23 Z" fill="url(#sc-cap-under)" />
      <!-- Cap diamond top plate -->
      <polygon points="52,4 82,16 52,28 22,16" fill="url(#sc-cap-grad)" />
      <!-- Cap top rim lighting -->
      <polyline points="22,16 52,4 82,16" stroke="#c084fc" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8" />

      <!-- Cap button center -->
      <ellipse cx="52" cy="16" rx="2.5" ry="1.5" fill="#e9d5ff" />

      <!-- Tassel cord & hanging bell -->
      <path d="M 52 16 C 62 17 76 18 78 26 L 79 38" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <!-- Tassel bell -->
      <path d="M 77 38 C 76 43 76 46 79 46 C 82 46 82 43 81 38 Z" fill="#c084fc" />
    </svg>
  </div>

  <div class="brand-name">
    <span class="brand-study">Study</span><span class="brand-chat">chat</span>
  </div>

  <!-- Thinking animation pill as specified by user -->
  <div class="thinking-badge">
    <div class="badge-logo">
      <svg class="studychat-logo thinking" viewBox="0 0 100 100" fill="none">
        <use href="#sc-logo-def" />
      </svg>
    </div>
    <span class="badge-text">Studychat is thinking...</span>
    <div class="badge-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>
</body>
</html>
